name: CD Database Production (AWS Lightsail)

on:
  push:
    branches: ['master']

env:
  REPOSITORY: ${{ github.repository }}
  DB_DOCKER: postgres-server

jobs:
  deploy-prod:
    name: Deploy Database to AWS Lightsail
    runs-on: ubuntu-22.04
    steps:
      - name: 🚀 Deploy PostgreSQL to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONTAINER_NAME: ${{ env.DB_DOCKER }}
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY }}
          envs: CONTAINER_NAME
          script: |
            docker network create master 2>/dev/null || true
            docker rm -f $CONTAINER_NAME || true
            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              --memory 512m \
              --memory-swap 1024m \
              --network master \
              -p 5432:5432 \
              -e POSTGRES_USER=master \
              -e POSTGRES_PASSWORD=master \
              -e POSTGRES_DB=master_z8ur \
              -v postgres-data:/var/lib/postgresql/data \
              postgres:15.10

            echo "⏳ Esperando a que PostgreSQL inicie..."
            sleep 10

            # Verificar que el contenedor esté corriendo
            STATUS=$(docker inspect --format='{{.State.Status}}' $CONTAINER_NAME 2>/dev/null)
            if [ "$STATUS" != "running" ]; then
              echo "❌ Fallo al iniciar PostgreSQL"
              docker logs --tail 50 $CONTAINER_NAME
              exit 1
            fi

            echo "✅ Base de datos desplegada con éxito"

      - name: 🔔 Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Despliegue Base de Datos Exitoso!*\n*Repositorio:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🔔 Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *Despliegue Base de Datos Fallido!*\n*Repositorio:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}