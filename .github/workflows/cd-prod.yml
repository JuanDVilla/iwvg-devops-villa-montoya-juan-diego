name: CD Production (AWS Lightsail)

on:
  push:
    branches: ['master']

env:
  REPOSITORY: ${{ github.repository }}
  GHCR_URL: ghcr.io

jobs:
  deploy-prod:
    name: Build, Push & Deploy to AWS Lightsail
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      
      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}
          
      - name: 🏷️ Set env variables | VERSION Repository | ARTIFACT version from pom | REPO in Lowr Case from Git
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPO_LOWER }}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPO_LOWER }}:latest

      - name: 🚀 Deploy to Lightsail Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}" | docker login ${{ env.GHCR_URL }} -u ${{ github.actor }} --password-stdin
            
            docker pull ${{ env.GHCR_URL }}/${{ env.REPO_LOWER }}:latest
            docker rm -f ${{env.ARTIFACT}} || true
            docker run -d \
              --name ${{env.ARTIFACT}} \
              --restart always \
              --memory 512m \ 
              --memory-swap 1024m \ 
              --network master \ 
              -p 10000:10000 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e PRODUCTION_USER_DATABASE="${{secrets.PRODUCTION_USER_DATABASE}}" \
              -e PRODUCTION_PASSWORD_DATABASE=${{secrets.PRODUCTION_PASSWORD_DATABASE}} \
              ${{ env.GHCR_URL }}/${{ env.REPO_LOWER }}:latest
          
            echo "⏳ Esperando a que se levante"
            for i in $(seq 1 6); do
              sleep 15
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' ${{ env.ARTIFACT }} 2>/dev/null)
              echo "Intento $i: $STATUS"
              [ "$STATUS" = "healthy" ] && break
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "❌ Deploy fallido"
              docker logs --tail 50 ${{ env.ARTIFACT }}
              exit 1
            fi

            echo "✅ Deploy exitoso"
            docker image prune --filter "until=12h" -f

      - name: 🔔 Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Despliegue de Producción Exitoso!*\n*Repositorio:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🔔 Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *Despliegue de Producción Fallido!*\n*Repositorio:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}