name: CD Production (AWS Lightsail)

on:
  push:
    branches: ['master']

env:
  REPOSITORY: ${{ github.repository }}
  GHCR_URL: ghcr.io

jobs:
  deploy-prod:
    name: Build, Push & Deploy to AWS Lightsail
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      
      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}
          
      - name: 🏷️ Set env variables | VERSION Repository | ARTIFACT version from pom | REPO in Lowr Case from Git
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPO_LOWER }}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPO_LOWER }}:latest

      - name: 🚀 Deploy to Lightsail Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT }}
          REPO_NAME: ${{ env.REPO_LOWER }}
          GHCR_REGISTRY: ${{ env.GHCR_URL }}
          DB_USER: ${{ secrets.PRODUCTION_USER_DATABASE }}
          DB_PASS: ${{ secrets.PRODUCTION_PASSWORD_DATABASE }}
          GH_USER: ${{ github.actor }}
          GH_PAT: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY }}
          envs: ARTIFACT_NAME,REPO_NAME,GHCR_REGISTRY,DB_USER,DB_PASS,GH_USER,GH_PAT
          script: |
            echo "$GH_PAT" | docker login $GHCR_REGISTRY -u $GH_USER --password-stdin            
            docker pull $GHCR_REGISTRY/$REPO_NAME:latest
            docker rm -f $ARTIFACT_NAME || true
            docker run -d \
              --name $ARTIFACT_NAME \
              --restart always \
              --memory 512m \
              --memory-swap 1024m \
              --network master \
              -p 10000:10000 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e PRODUCTION_USER_DATABASE="$DB_USER" \
              -e PRODUCTION_PASSWORD_DATABASE="$DB_PASS" \
              $GHCR_REGISTRY/$REPO_NAME:latest
          
            echo "⏳ Esperando a que se levante el contenedor..."
            for i in $(seq 1 6); do
              sleep 15
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' $ARTIFACT_NAME 2>/dev/null)
              echo "Intento $i: $STATUS"
              [ "$STATUS" = "healthy" ] || [ "$STATUS" = "running" ] && break
            done

            if [ "$STATUS" != "healthy" ] && [ "$STATUS" != "running" ]; then
              echo "❌ Deploy fallido"
              docker logs --tail 50 $ARTIFACT_NAME
              exit 1
            fi

            echo "✅ Deploy exitoso"
            docker image prune -af --filter "until=24h"

      - name: 🔔 Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Despliegue de Producción Exitoso!*\n*Repositorio:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🔔 Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *Despliegue de Producción Fallido!*\n*Repositorio:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}